<form class="todo-form" [formGroup]="form" (ngSubmit)="submit()">
  <label class="todo-form__label" for="todo-title">New todo</label>

  <div class="todo-form__row">
    <input
      id="todo-title"
      type="text"
      class="todo-form__input"
      placeholder="What needs doing?"
      autocomplete="off"
      formControlName="title"
      [attr.aria-invalid]="showError"
      [attr.aria-describedby]="showError ? 'todo-title-error' : null"
    />

    <button type="submit" class="todo-form__submit" [disabled]="disabled()">
      {{ disabled() ? 'Adding…' : 'Add' }}
    </button>
  </div>

  <div class="todo-form__footer">
    @if (showError) {
      <p id="todo-title-error" class="todo-form__error">
        @if (title.hasError('maxlength')) {
          Keep it under {{ maxLength }} characters.
        } @else {
          Give your todo a title.
        }
      </p>
    }

    <!-- live counter. -->
    @if (titleLength > 0) {
      <p
        class="todo-form__counter"
        [class.todo-form__counter--over]="titleLength > maxLength"
        aria-hidden="true"
      >
        {{ titleLength }} / {{ maxLength }}
      </p>
    }
  </div>
</form>
